<div>
    <h4 class="form_heading">Step 3 - Higher Institution</h4>
    <form>
        <h4 class="form-sub-heading">First Institution</h4>
        <div class="form-part">
            <div class="control-group">
                <label class="control-label" for="inputFirstName">Name Of institution</label>
                <div class="controls">
                    <input type="text" id="inputFirstName" placeholder="First name">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputMiddelName">Middle Name</label>
                <div class="controls">
                    <input type="text" id="inputMiddelName" placeholder="Middle Name">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputSurname">Surname</label>
                <div class="controls">
                    <input type="text" id="inputSurname" placeholder="Surname">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputDOB">Date Of Birth</label>
                <div class="controls">
                    <input type="date" id="inputDOB" placeholder="Date Of Birth">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputPOB">Place Of Birth</label>
                <div class="controls">
                    <input type="text" id="inputPOB" placeholder="Place Of Birth">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputGender">Gender</label>
                <div class="controls">
                    <select id="inputGender" ng-model="biodata.gender" ng-options="g.value for g in gender">
                        <option value=""> -- Select your Gender -- </option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputPhone">Phone</label>
                <div class="controls">
                    <input type="text" id="inputPhone" placeholder="Enter Phone">
                </div>
            </div>
        </div>
        <div class="form-part">
            <div class="control-group">
                <label class="control-label" for="inputEmail">Email</label>
                <div class="controls">
                    <input type="text" id="inputEmail" placeholder="Email">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputCompoundName">Compound name</label>
                <div class="controls">
                    <input type="text" id="inputCompoundName" placeholder="Middle Name">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputResAdd">Residential Address</label>
                <div class="controls">
                    <textarea id="inputResAdd" placeholder="Enter Residential Address" rows="3"></textarea>
                </div>
            </div>

        </div>


        <div class="form-part" style="clear: both">
            <h4 style="clear: both" class="form-sub-heading">Maternal Info (Mother's Details)</h4>
            <div class="control-group">
                <label class="control-label" for="inputFirstName">First name</label>
                <div class="controls">
                    <input type="text" id="inputFirstName" placeholder="First name">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputMiddelName">Surname Name</label>
                <div class="controls">
                    <input type="text" id="inputMiddelName" placeholder="Middle Name">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputSurname">Maiden Name</label>
                <div class="controls">
                    <input type="text" id="inputSurname" placeholder="Surname">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputDOB">Village/Town</label>
                <div class="controls">
                    <input type="text" id="inputDOB" placeholder="Date Of Birth">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputGender">Clan</label>
                <div class="controls">
                    <input type="text" id="inputDOB" placeholder="Date Of Birth">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputPhone">LGA</label>
                <div class="controls">
                    <input type="text" id="inputPhone" placeholder="Enter Phone">
                </div>
            </div>
        </div>
        <div class="form-part" style="margin-bottom: 20px">
            <h4 style="clear: both" class="form-sub-heading">Paternal Info (Father's Details)</h4>
            <div class="control-group">
                <label class="control-label" for="inputFirstName">First name</label>
                <div class="controls">
                    <input type="text" id="inputFirstName" placeholder="First name">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputMiddelName">Surname Name</label>
                <div class="controls">
                    <input type="text" id="inputMiddelName" placeholder="Middle Name">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputSurname">Maiden Name</label>
                <div class="controls">
                    <input type="text" id="inputSurname" placeholder="Surname">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputDOB">Village/Town</label>
                <div class="controls">
                    <input type="text" id="inputDOB" placeholder="Date Of Birth">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputGender">Clan</label>
                <div class="controls">
                    <input type="text" id="inputDOB" placeholder="Date Of Birth">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="inputPhone">LGA</label>
                <div class="controls">
                    <input type="text" id="inputPhone" placeholder="Enter Phone">
                </div>
            </div>
        </div>
        <div style="clear: both" class="form-actions">
            <button type="submit"  class="btn" ui-sref="main.biodata"> Back to BIO Data</button>
            <button type="submit"  class="btn" ng-click="gotoProfQuali()"> Save and Continue to Professional Qualification Details >> </button>
        </div>
    </form>
</div>
